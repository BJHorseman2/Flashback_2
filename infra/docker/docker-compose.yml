version: '3.8'

services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://flashback:flashback@postgres:5432/flashback
      - REDIS_URL=redis://redis:6379
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
      - GCP_REGION=${GCP_REGION:-us-central1}
      - GCS_BUCKET=${GCS_BUCKET:-flashback-assets}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://flashback:flashback@postgres:5432/flashback
      - REDIS_URL=redis://redis:6379
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
      - GCP_REGION=${GCP_REGION:-us-central1}
      - GCS_BUCKET=${GCS_BUCKET:-flashback-assets}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=flashback
      - POSTGRES_PASSWORD=flashback
      - POSTGRES_DB=flashback
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
