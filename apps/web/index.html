<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flashback Daily</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Home Screen */
        .screen {
            display: none;
            min-height: 100vh;
            padding: 20px;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
        }

        #home {
            justify-content: center;
            align-items: center;
            gap: 40px;
        }

        .logo {
            text-align: center;
        }

        .logo h1 {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 4px;
            font-family: Georgia, serif;
        }

        .logo p {
            font-size: 14px;
            color: #888;
            letter-spacing: 8px;
            margin-top: 8px;
        }

        .actions {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 12px;
            color: #fff;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background: rgba(255,255,255,0.15);
        }

        .action-btn .icon {
            font-size: 24px;
            width: 32px;
        }

        .action-btn .text h3 {
            font-size: 18px;
            font-weight: 600;
        }

        .action-btn .text p {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
        }

        .action-btn .arrow {
            margin-left: auto;
            color: #888;
        }

        .date-picker-container {
            width: 100%;
            max-width: 400px;
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .date-picker-container.active {
            display: flex;
        }

        .date-picker-container input {
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 18px;
            text-align: center;
        }

        .date-picker-container button {
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: #fff;
            color: #000;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Loading */
        .loading {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .loading.active {
            display: flex;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Flashback Screen */
        #flashback {
            padding: 0;
        }

        .flashback-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            position: sticky;
            top: 0;
            background: #000;
            z-index: 10;
        }

        .back-btn, .save-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
        }

        .flashback-content {
            padding: 0 20px 40px;
        }

        .date-display {
            text-align: center;
            font-size: 14px;
            color: #888;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .lens-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(255,255,255,0.1);
            margin-bottom: 16px;
        }

        .lens-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .lens-image.active {
            display: block;
        }

        .lens-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #888;
            gap: 8px;
        }

        .lens-placeholder.hidden {
            display: none;
        }

        .lens-nav {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
        }

        .lens-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            cursor: pointer;
            transition: background 0.2s;
        }

        .lens-dot.active {
            background: #fff;
        }

        .lens-pills {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .lens-pill {
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255,255,255,0.15);
            border: none;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lens-pill.active {
            background: #fff;
            color: #000;
            font-weight: 600;
        }

        .event-title {
            font-size: 28px;
            font-weight: 700;
            font-family: Georgia, serif;
            text-align: center;
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .event-year {
            display: inline-block;
            padding: 8px 20px;
            background: #fff;
            color: #000;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
            font-family: monospace;
            margin-bottom: 20px;
        }

        .year-container {
            text-align: center;
        }

        .event-summary {
            font-size: 16px;
            line-height: 1.6;
            color: rgba(255,255,255,0.9);
            text-align: center;
            margin-bottom: 16px;
            padding: 0 10px;
        }

        .disclosure {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #888;
            font-size: 12px;
            margin-bottom: 24px;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .sources-btn {
            padding: 12px 24px;
            border-radius: 25px;
            background: rgba(255,255,255,0.15);
            border: none;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .share-btn {
            padding: 12px 24px;
            border-radius: 25px;
            background: #fff;
            border: none;
            color: #000;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            padding: 20px;
            overflow-y: auto;
        }

        .modal.active {
            display: block;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-header h2 {
            font-size: 20px;
        }

        .modal-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        .source-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            margin-bottom: 12px;
            color: #fff;
            text-decoration: none;
        }

        .source-link:hover {
            background: rgba(255,255,255,0.15);
        }

        /* Error */
        .error {
            color: #ff6b6b;
            text-align: center;
            padding: 20px;
            display: none;
        }

        .error.active {
            display: block;
        }

        /* Swipe hint */
        .swipe-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            pointer-events: none;
            animation: fadeOut 3s forwards;
        }

        @keyframes fadeOut {
            0%, 70% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- Home Screen -->
    <div id="home" class="screen active">
        <div class="logo">
            <h1>FLASHBACK</h1>
            <p>DAILY</p>
        </div>

        <div class="actions">
            <button class="action-btn" onclick="fetchToday()">
                <span class="icon">📅</span>
                <div class="text">
                    <h3>Today</h3>
                    <p id="today-date"></p>
                </div>
                <span class="arrow">›</span>
            </button>

            <button class="action-btn" onclick="showDatePicker()">
                <span class="icon">🗓️</span>
                <div class="text">
                    <h3>Pick a Date</h3>
                    <p>Choose any date in history</p>
                </div>
                <span class="arrow">›</span>
            </button>

            <button class="action-btn" onclick="fetchRandom()">
                <span class="icon">🎲</span>
                <div class="text">
                    <h3>Random</h3>
                    <p>Surprise me</p>
                </div>
                <span class="arrow">›</span>
            </button>
        </div>

        <div class="date-picker-container" id="datePicker">
            <input type="date" id="dateInput" max="">
            <button onclick="fetchSelectedDate()">Generate Flashback</button>
        </div>

        <div class="loading" id="homeLoading">
            <div class="spinner"></div>
            <p>Finding the most significant event...</p>
        </div>

        <div class="error" id="homeError"></div>
    </div>

    <!-- Flashback Screen -->
    <div id="flashback" class="screen">
        <div class="flashback-header">
            <button class="back-btn" onclick="goHome()">← Back</button>
            <button class="save-btn" onclick="saveFlashback()">☆</button>
        </div>

        <div class="flashback-content">
            <div class="date-display" id="flashbackDate"></div>

            <div class="lens-container" id="lensContainer">
                <div class="lens-placeholder" id="lensPlaceholder">
                    <span style="font-size: 40px;">🖼️</span>
                    <span>AI Recreation</span>
                </div>
                <div class="swipe-hint" id="swipeHint">← Swipe to see all 5 lenses →</div>
                <div class="lens-nav" id="lensNav"></div>
            </div>

            <div class="lens-pills" id="lensPills"></div>

            <h1 class="event-title" id="eventTitle"></h1>

            <div class="year-container">
                <span class="event-year" id="eventYear"></span>
            </div>

            <p class="event-summary" id="eventSummary"></p>

            <div class="disclosure">
                <span>✨</span>
                <span id="disclosure">AI Recreation</span>
            </div>

            <div class="action-buttons">
                <button class="sources-btn" onclick="showSources()">
                    <span>🔗</span> Sources
                </button>
                <button class="share-btn" onclick="shareFlashback()">
                    <span>↗</span> Share
                </button>
            </div>
        </div>
    </div>

    <!-- Sources Modal -->
    <div class="modal" id="sourcesModal">
        <div class="modal-header">
            <h2>Sources</h2>
            <button class="modal-close" onclick="closeSources()">Done</button>
        </div>
        <div id="sourcesList"></div>
    </div>

    <script>
        // API Configuration
        const API_BASE = 'http://localhost:8000';

        // State
        let currentFlashback = null;
        let currentLensIndex = 0;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            document.getElementById('today-date').textContent = formatDateDisplay(today);
            document.getElementById('dateInput').max = today.toISOString().split('T')[0];
            document.getElementById('dateInput').value = today.toISOString().split('T')[0];
        });

        // Formatting
        function formatDateDisplay(date) {
            return date.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
        }

        function formatDateAPI(date) {
            return date.toISOString().split('T')[0];
        }

        // Navigation
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function goHome() {
            showScreen('home');
            currentFlashback = null;
        }

        function showDatePicker() {
            document.getElementById('datePicker').classList.toggle('active');
        }

        // API Calls
        async function fetchFlashback(endpoint) {
            const loading = document.getElementById('homeLoading');
            const error = document.getElementById('homeError');

            loading.classList.add('active');
            error.classList.remove('active');

            try {
                const response = await fetch(`${API_BASE}${endpoint}`);
                const data = await response.json();

                if (data.status === 'ready' && data.scene) {
                    currentFlashback = data.scene;
                    displayFlashback(data.scene);
                } else if (data.status === 'generating') {
                    error.textContent = 'Generating... Please try again in a few seconds.';
                    error.classList.add('active');
                } else {
                    throw new Error(data.message || 'Failed to load flashback');
                }
            } catch (e) {
                console.error(e);
                error.textContent = e.message || 'Failed to connect to server. Make sure the API is running.';
                error.classList.add('active');
            } finally {
                loading.classList.remove('active');
            }
        }

        function fetchToday() {
            fetchFlashback('/v1/flashback/today');
        }

        function fetchRandom() {
            fetchFlashback('/v1/flashback/random');
        }

        function fetchSelectedDate() {
            const date = document.getElementById('dateInput').value;
            if (date) {
                fetchFlashback(`/v1/flashback?date=${date}`);
            }
        }

        // Display
        function displayFlashback(scene) {
            currentLensIndex = 0;

            // Date
            const date = new Date(scene.date + 'T00:00:00');
            document.getElementById('flashbackDate').textContent =
                formatDateDisplay(date).toUpperCase();

            // Title, Year, Summary
            document.getElementById('eventTitle').textContent = scene.title;
            document.getElementById('eventYear').textContent = scene.year || '';
            document.getElementById('eventSummary').textContent = scene.summary;
            document.getElementById('disclosure').textContent = scene.disclosure;

            // Lenses
            const container = document.getElementById('lensContainer');
            const placeholder = document.getElementById('lensPlaceholder');
            const pills = document.getElementById('lensPills');
            const nav = document.getElementById('lensNav');

            // Clear old images
            container.querySelectorAll('.lens-image').forEach(img => img.remove());

            // Add lens images
            scene.lenses.forEach((lens, i) => {
                if (lens.image_url) {
                    const img = document.createElement('img');
                    img.className = 'lens-image' + (i === 0 ? ' active' : '');
                    img.src = lens.image_url;
                    img.alt = lens.name;
                    container.insertBefore(img, placeholder);
                    placeholder.classList.add('hidden');
                }
            });

            // If no images, show placeholder
            if (!scene.lenses.some(l => l.image_url)) {
                placeholder.classList.remove('hidden');
            }

            // Pills
            pills.innerHTML = scene.lenses.map((lens, i) =>
                `<button class="lens-pill${i === 0 ? ' active' : ''}" onclick="selectLens(${i})">${lens.name}</button>`
            ).join('');

            // Nav dots
            nav.innerHTML = scene.lenses.map((_, i) =>
                `<div class="lens-dot${i === 0 ? ' active' : ''}" onclick="selectLens(${i})"></div>`
            ).join('');

            // Show screen
            showScreen('flashback');

            // Setup swipe
            setupSwipe();
        }

        function selectLens(index) {
            currentLensIndex = index;

            // Update images
            document.querySelectorAll('.lens-image').forEach((img, i) => {
                img.classList.toggle('active', i === index);
            });

            // Update pills
            document.querySelectorAll('.lens-pill').forEach((pill, i) => {
                pill.classList.toggle('active', i === index);
            });

            // Update dots
            document.querySelectorAll('.lens-dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });
        }

        function setupSwipe() {
            const container = document.getElementById('lensContainer');
            let startX = 0;

            container.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
            });

            container.addEventListener('touchend', (e) => {
                const endX = e.changedTouches[0].clientX;
                const diff = startX - endX;

                if (Math.abs(diff) > 50) {
                    if (diff > 0 && currentLensIndex < 4) {
                        selectLens(currentLensIndex + 1);
                    } else if (diff < 0 && currentLensIndex > 0) {
                        selectLens(currentLensIndex - 1);
                    }
                }
            });
        }

        // Sources
        function showSources() {
            if (!currentFlashback) return;

            const list = document.getElementById('sourcesList');
            list.innerHTML = currentFlashback.sources.map(s =>
                `<a href="${s.url}" target="_blank" class="source-link">
                    <span>${s.label}</span>
                    <span>↗</span>
                </a>`
            ).join('');

            document.getElementById('sourcesModal').classList.add('active');
        }

        function closeSources() {
            document.getElementById('sourcesModal').classList.remove('active');
        }

        // Share
        async function shareFlashback() {
            if (!currentFlashback) return;

            const text = `${currentFlashback.title} (${currentFlashback.year})\n\n${currentFlashback.summary}\n\n🔗 ${currentFlashback.sources[0]?.url || ''}\n\n✨ AI Recreation via Flashback Daily`;

            if (navigator.share) {
                try {
                    await navigator.share({ text });
                } catch (e) {
                    console.log('Share cancelled');
                }
            } else {
                await navigator.clipboard.writeText(text);
                alert('Copied to clipboard!');
            }
        }

        // Save (local storage)
        function saveFlashback() {
            if (!currentFlashback) return;

            let saved = JSON.parse(localStorage.getItem('savedFlashbacks') || '[]');
            if (!saved.find(s => s.scene_id === currentFlashback.scene_id)) {
                saved.push(currentFlashback);
                localStorage.setItem('savedFlashbacks', JSON.stringify(saved));
                document.querySelector('.save-btn').textContent = '★';
                alert('Saved!');
            }
        }
    </script>
</body>
</html>
