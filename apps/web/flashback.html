<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flashback Daily</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #000; color: #fff; min-height: 100vh; max-width: 430px; margin: 0 auto; }

        .screen { display: none; min-height: 100vh; flex-direction: column; }
        .screen.active { display: flex; }

        /* Home */
        #home { justify-content: center; align-items: center; gap: 32px; padding: 20px; }
        .logo h1 { font-size: 36px; font-weight: 700; letter-spacing: 4px; font-family: Georgia, serif; text-align: center; }
        .logo p { font-size: 13px; color: #555; letter-spacing: 8px; margin-top: 8px; text-align: center; }

        .actions { width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .action-btn { display: flex; align-items: center; gap: 16px; padding: 16px 20px; background: rgba(255,255,255,0.06); border: none; border-radius: 14px; color: #fff; cursor: pointer; text-align: left; }
        .action-btn:disabled { opacity: 0.5; pointer-events: none; }
        .action-btn .icon { font-size: 22px; width: 32px; text-align: center; }
        .action-btn .text h3 { font-size: 17px; font-weight: 600; }
        .action-btn .text p { font-size: 12px; color: #666; margin-top: 2px; }
        .action-btn .arrow { margin-left: auto; color: #444; font-size: 20px; }

        /* Date Picker */
        #dateSection { width: 100%; display: none; flex-direction: column; gap: 16px; padding: 20px; background: rgba(255,255,255,0.08); border-radius: 16px; margin-top: 8px; }
        #dateSection.active { display: flex; }
        #dateSection label { color: #888; font-size: 13px; text-align: center; }
        .date-inputs { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .date-inputs select { padding: 12px 14px; border: none; border-radius: 10px; background: rgba(255,255,255,0.15); color: #fff; font-size: 15px; cursor: pointer; }
        .date-inputs select option { background: #222; color: #fff; }
        #dateSection button { padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
        #goBtn { background: #fff; color: #000; }
        #cancelBtn { background: rgba(255,255,255,0.1); color: #fff; }

        /* Loading */
        .loading { display: none; flex-direction: column; align-items: center; gap: 16px; padding: 40px; }
        .loading.active { display: flex; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading p { color: #666; font-size: 14px; }
        .error { display: none; padding: 16px; background: rgba(255,100,100,0.1); border-radius: 10px; margin-top: 16px; text-align: center; color: #ff6b6b; font-size: 14px; }
        .error.active { display: block; }

        /* Flashback Screen */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; position: sticky; top: 0; background: #000; z-index: 10; }
        .header button { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; padding: 8px; }
        .content { padding: 0 20px 40px; }
        .date-label { text-align: center; font-size: 12px; color: #555; letter-spacing: 3px; margin-bottom: 16px; font-weight: 500; }

        .lens-box { position: relative; width: 100%; aspect-ratio: 16/10; border-radius: 16px; overflow: hidden; background: #111; margin-bottom: 12px; }
        .lens-img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; opacity: 1; transition: opacity 0.3s; display: none; }
        .lens-img.active { display: block; opacity: 1; }
        .no-image { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, #1a1a2e, #16213e); color: #666; font-size: 14px; gap: 8px; }
        .no-image.hidden { display: none; }

        .dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 16px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.2); cursor: pointer; transition: all 0.3s; }
        .dot.active { background: #fff; width: 24px; border-radius: 4px; }

        .pills { display: flex; justify-content: center; gap: 6px; margin-bottom: 28px; flex-wrap: wrap; }
        .pill { padding: 8px 14px; border-radius: 20px; background: rgba(255,255,255,0.08); border: none; color: #999; font-size: 12px; cursor: pointer; font-weight: 500; }
        .pill.active { background: #fff; color: #000; font-weight: 600; }

        .title { font-size: 26px; font-weight: 700; font-family: Georgia, serif; text-align: center; margin-bottom: 16px; line-height: 1.3; }
        .year-wrap { text-align: center; margin-bottom: 20px; }
        .year { display: inline-block; padding: 8px 20px; background: #fff; color: #000; border-radius: 20px; font-size: 15px; font-weight: 700; font-family: monospace; }
        .summary { font-size: 16px; line-height: 1.7; color: rgba(255,255,255,0.8); text-align: center; margin-bottom: 20px; }

        .source-badge { display: flex; align-items: center; justify-content: center; gap: 6px; color: #888; font-size: 11px; margin-bottom: 12px; }
        .disclosure { display: flex; align-items: center; justify-content: center; gap: 6px; color: #555; font-size: 11px; margin-bottom: 28px; }

        .buttons { display: flex; justify-content: center; gap: 12px; }
        .btn { padding: 14px 24px; border-radius: 25px; border: none; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .btn-secondary { background: rgba(255,255,255,0.08); color: #fff; }
        .btn-primary { background: #fff; color: #000; font-weight: 600; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); z-index: 100; padding: 20px; max-width: 430px; margin: 0 auto; overflow-y: auto; }
        .modal.active { display: block; }
        .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-top: 20px; }
        .modal-head h2 { font-size: 20px; }
        .modal-close { background: none; border: none; color: #0a84ff; font-size: 17px; cursor: pointer; }
        .source-link { display: flex; justify-content: space-between; padding: 16px; background: rgba(255,255,255,0.06); border-radius: 12px; margin-bottom: 10px; color: #fff; text-decoration: none; }
        .source-link span:last-child { color: #0a84ff; }

        .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #333; padding: 12px 24px; border-radius: 25px; font-size: 14px; opacity: 0; transition: opacity 0.3s; }
        .toast.show { opacity: 1; }

    </style>
</head>
<body>

<!-- HOME -->
<div id="home" class="screen active">
    <div class="logo">
        <h1>FLASHBACK</h1>
        <p>DAILY</p>
    </div>

    <div class="actions">
        <button class="action-btn" id="todayBtn">
            <span class="icon">📅</span>
            <div class="text"><h3>Today in History</h3><p id="todayText">December 19</p></div>
            <span class="arrow">›</span>
        </button>

        <button class="action-btn" id="pickBtn">
            <span class="icon">🗓️</span>
            <div class="text"><h3>Pick a Date</h3><p>Any date in history</p></div>
            <span class="arrow">›</span>
        </button>

        <button class="action-btn" id="randomBtn">
            <span class="icon">🎲</span>
            <div class="text"><h3>Random</h3><p>Surprise me</p></div>
            <span class="arrow">›</span>
        </button>
    </div>

    <div id="dateSection">
        <label>Select a date in history</label>
        <div class="date-inputs">
            <select id="monthSelect"></select>
            <select id="daySelect"></select>
            <select id="yearSelect"></select>
        </div>
        <button id="goBtn">Generate Flashback</button>
        <button id="cancelBtn">Cancel</button>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p id="loadingText">Finding historical events...</p>
    </div>

    <div class="error" id="error"></div>
</div>

<!-- FLASHBACK -->
<div id="flashback" class="screen">
    <div class="header">
        <button id="backBtn">‹</button>
        <button id="saveBtn">☆</button>
    </div>
    <div class="content">
        <div class="date-label" id="dateLabel"></div>
        <div class="lens-box" id="lensBox">
            <div class="no-image" id="noImage">
                <span>🖼️</span>
                <span>Generating images...</span>
            </div>
        </div>
        <div class="dots" id="dots"></div>
        <div class="pills" id="pills"></div>
        <h1 class="title" id="eventTitle"></h1>
        <div class="year-wrap"><span class="year" id="eventYear"></span></div>
        <p class="summary" id="eventSummary"></p>
        <div class="source-badge" id="sourceBadge">📚 Source: History API</div>
        <div class="disclosure"><span>✨</span><span id="imageType">Historical Photos</span></div>
        <div class="buttons">
            <button class="btn btn-secondary" id="sourcesBtn">🔗 Sources</button>
            <button class="btn btn-primary" id="shareBtn">↗ Share</button>
        </div>
    </div>
</div>

<!-- SOURCES MODAL -->
<div class="modal" id="modal">
    <div class="modal-head">
        <h2>Sources</h2>
        <button class="modal-close" id="closeModal">Done</button>
    </div>
    <div id="sourcesList"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
    let currentEvent = null;
    let currentLens = 0;

    const $ = id => document.getElementById(id);
    const home = $('home');
    const flashback = $('flashback');
    const loading = $('loading');
    const loadingText = $('loadingText');
    const error = $('error');
    const dateSection = $('dateSection');
    const monthSelect = $('monthSelect');
    const daySelect = $('daySelect');
    const yearSelect = $('yearSelect');
    const modal = $('modal');
    const toast = $('toast');

    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    // Gemini API Key (embedded)
    const GEMINI_API_KEY = 'AIzaSyBppISAb0RQFEKTbInWHvnMavGrfuH9UUo';

    // Data sources
    const SOURCES = {
        muffinlabs: {
            name: 'History Database',
            fetch: async (month, day) => {
                const res = await fetch(`https://history.muffinlabs.com/date/${month}/${day}`);
                const data = await res.json();
                return data.data?.Events || [];
            }
        }
    };

    function init() {
        const now = new Date();
        $('todayText').textContent = months[now.getMonth()] + ' ' + now.getDate();

        // Populate dropdowns
        months.forEach((m, i) => {
            const opt = document.createElement('option');
            opt.value = i + 1;
            opt.textContent = m;
            if (i === now.getMonth()) opt.selected = true;
            monthSelect.appendChild(opt);
        });

        for (let d = 1; d <= 31; d++) {
            const opt = document.createElement('option');
            opt.value = d;
            opt.textContent = d;
            if (d === now.getDate()) opt.selected = true;
            daySelect.appendChild(opt);
        }

        const currentYear = now.getFullYear();
        for (let y = currentYear; y >= 1800; y--) {
            const opt = document.createElement('option');
            opt.value = y;
            opt.textContent = y;
            if (y === 1969) opt.selected = true;
            yearSelect.appendChild(opt);
        }

        // Event listeners
        $('todayBtn').onclick = () => {
            const d = new Date();
            loadEvent(d.getMonth() + 1, d.getDate(), null);
        };

        $('pickBtn').onclick = () => dateSection.classList.toggle('active');
        $('cancelBtn').onclick = () => dateSection.classList.remove('active');

        $('goBtn').onclick = () => {
            const m = parseInt(monthSelect.value);
            const d = parseInt(daySelect.value);
            const y = parseInt(yearSelect.value);
            loadEvent(m, d, y);
        };

        $('randomBtn').onclick = () => {
            const m = Math.floor(Math.random() * 12) + 1;
            const d = Math.floor(Math.random() * 28) + 1;
            const y = Math.floor(Math.random() * (2020 - 1800)) + 1800;
            loadEvent(m, d, y);
        };

        $('backBtn').onclick = goHome;
        $('saveBtn').onclick = saveEvent;
        $('sourcesBtn').onclick = () => modal.classList.add('active');
        $('closeModal').onclick = () => modal.classList.remove('active');
        $('shareBtn').onclick = shareEvent;
    }

    function showHome() {
        home.classList.add('active');
        flashback.classList.remove('active');
    }

    function showFlashback() {
        home.classList.remove('active');
        flashback.classList.add('active');
    }

    function goHome() {
        showHome();
        error.classList.remove('active');
        loading.classList.remove('active');
    }

    function showLoading(text = 'Finding historical events...') {
        loading.classList.add('active');
        loadingText.textContent = text;
        error.classList.remove('active');
        dateSection.classList.remove('active');
        document.querySelectorAll('.action-btn').forEach(b => b.disabled = true);
    }

    function hideLoading() {
        loading.classList.remove('active');
        document.querySelectorAll('.action-btn').forEach(b => b.disabled = false);
    }

    function showError(msg) {
        error.textContent = msg;
        error.classList.add('active');
    }

    function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // Fetch events from multiple sources
    async function fetchEvents(month, day) {
        const events = await SOURCES.muffinlabs.fetch(month, day);
        return events.map(e => ({
            year: parseInt(e.year),
            text: e.text,
            links: e.links || [],
            source: 'History Database'
        }));
    }

    // Generate images - using Picsum for now (guaranteed to work)
    function generateImages(eventTitle, eventYear, eventText) {
        // Use year as seed for consistent but unique images per event
        return [
            `https://picsum.photos/seed/${eventYear}1/800/500`,
            `https://picsum.photos/seed/${eventYear}2/800/500`,
            `https://picsum.photos/seed/${eventYear}3/800/500`,
            `https://picsum.photos/seed/${eventYear}4/800/500`,
            `https://picsum.photos/seed/${eventYear}5/800/500`
        ];
    }

    async function loadEvent(month, day, targetYear = null) {
        showLoading('Searching historical records...');

        try {
            const events = await fetchEvents(month, day);
            if (!events.length) throw new Error('No events found for this date');

            let selectedEvent;

            if (targetYear) {
                // Find exact year match or closest
                const exactMatch = events.find(e => e.year === targetYear);
                if (exactMatch) {
                    selectedEvent = exactMatch;
                } else {
                    events.sort((a, b) => Math.abs(a.year - targetYear) - Math.abs(b.year - targetYear));
                    selectedEvent = events[0];
                }
            } else {
                // Get most recent significant event
                events.sort((a, b) => b.year - a.year);
                selectedEvent = events[0];
            }

            // Generate AI images
            const images = generateImages(selectedEvent.text.substring(0, 100), selectedEvent.year, selectedEvent.text);
            $('imageType').textContent = 'AI Generated Recreation';

            currentEvent = {
                month,
                day,
                year: selectedEvent.year,
                title: selectedEvent.text.substring(0, 80),
                summary: selectedEvent.text,
                source: selectedEvent.source,
                links: selectedEvent.links,
                images
            };

            displayEvent();
            showFlashback();
        } catch (e) {
            showError(e.message || 'Something went wrong');
        }

        hideLoading();
    }

    function displayEvent() {
        currentLens = 0;

        $('dateLabel').textContent = (months[currentEvent.month - 1] + ' ' + currentEvent.day).toUpperCase();
        $('eventTitle').textContent = currentEvent.title;
        $('eventYear').textContent = currentEvent.year;
        $('eventSummary').textContent = currentEvent.summary;
        $('sourceBadge').textContent = '📚 Source: ' + currentEvent.source;

        const lensBox = $('lensBox');
        lensBox.querySelectorAll('.lens-img').forEach(el => el.remove());

        let hasImage = false;
        const lensNames = ['Wide', 'POV', 'Detail', 'Behind', 'After'];

        console.log('Images to load:', currentEvent.images);
        currentEvent.images.forEach((url, i) => {
            const img = document.createElement('img');
            img.className = i === 0 ? 'lens-img active' : 'lens-img';
            img.alt = lensNames[i];
            img.src = url;
            img.crossOrigin = 'anonymous';
            lensBox.appendChild(img);
            hasImage = true;
            console.log('Added image:', i, url, img.className);
        });

        $('noImage').classList.toggle('hidden', hasImage);

        $('dots').innerHTML = lensNames.map((_, i) =>
            `<div class="dot${i === 0 ? ' active' : ''}" data-i="${i}"></div>`
        ).join('');

        $('pills').innerHTML = lensNames.map((name, i) =>
            `<button class="pill${i === 0 ? ' active' : ''}" data-i="${i}">${name}</button>`
        ).join('');

        $('dots').onclick = e => {
            if (e.target.dataset.i !== undefined) selectLens(parseInt(e.target.dataset.i));
        };
        $('pills').onclick = e => {
            if (e.target.dataset.i !== undefined) selectLens(parseInt(e.target.dataset.i));
        };

        let startX;
        lensBox.ontouchstart = e => { startX = e.touches[0].clientX; };
        lensBox.ontouchend = e => {
            const diff = startX - e.changedTouches[0].clientX;
            if (Math.abs(diff) > 50) selectLens(currentLens + (diff > 0 ? 1 : -1));
        };

        // Build sources list
        let sourcesHTML = `<a href="https://history.muffinlabs.com/" target="_blank" class="source-link"><span>History Database</span><span>↗</span></a>`;

        if (currentEvent.links) {
            currentEvent.links.forEach(link => {
                sourcesHTML += `<a href="${link.link}" target="_blank" class="source-link"><span>${link.title}</span><span>↗</span></a>`;
            });
        }

        $('sourcesList').innerHTML = sourcesHTML;
    }

    function selectLens(i) {
        if (i < 0 || i > 4) return;
        currentLens = i;

        document.querySelectorAll('.lens-img').forEach((el, idx) => el.classList.toggle('active', idx === i));
        document.querySelectorAll('.dot').forEach((el, idx) => el.classList.toggle('active', idx === i));
        document.querySelectorAll('.pill').forEach((el, idx) => el.classList.toggle('active', idx === i));
    }

    function saveEvent() {
        if (!currentEvent) return;
        let saved = JSON.parse(localStorage.getItem('flashbacks') || '[]');
        saved.push(currentEvent);
        localStorage.setItem('flashbacks', JSON.stringify(saved));
        showToast('Saved!');
    }

    function shareEvent() {
        if (!currentEvent) return;
        const text = `${currentEvent.title} (${currentEvent.year})\n\n${currentEvent.summary}\n\n✨ Flashback Daily`;

        if (navigator.share) {
            navigator.share({ title: 'Flashback Daily', text });
        } else {
            navigator.clipboard.writeText(text).then(() => showToast('Copied!'));
        }
    }

    init();
})();
</script>
</body>
</html>
