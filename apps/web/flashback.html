<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flashback Daily</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #000; color: #fff; min-height: 100vh; max-width: 430px; margin: 0 auto; }

        .screen { display: none; min-height: 100vh; flex-direction: column; }
        .screen.active { display: flex; }

        #home { justify-content: center; align-items: center; gap: 32px; padding: 20px; }
        .logo h1 { font-size: 36px; font-weight: 700; letter-spacing: 4px; font-family: Georgia, serif; text-align: center; }
        .logo p { font-size: 13px; color: #555; letter-spacing: 8px; margin-top: 8px; text-align: center; }

        .actions { width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .action-btn { display: flex; align-items: center; gap: 16px; padding: 16px 20px; background: rgba(255,255,255,0.06); border: none; border-radius: 14px; color: #fff; cursor: pointer; text-align: left; }
        .action-btn:disabled { opacity: 0.5; pointer-events: none; }
        .action-btn .icon { font-size: 22px; width: 32px; text-align: center; }
        .action-btn .text h3 { font-size: 17px; font-weight: 600; }
        .action-btn .text p { font-size: 12px; color: #666; margin-top: 2px; }
        .action-btn .arrow { margin-left: auto; color: #444; font-size: 20px; }

        #dateSection { width: 100%; display: none; flex-direction: column; gap: 16px; padding: 20px; background: rgba(255,255,255,0.08); border-radius: 16px; margin-top: 8px; }
        #dateSection.active { display: flex; }
        #dateSection label { color: #888; font-size: 13px; text-align: center; }
        .date-inputs { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .date-inputs select { padding: 12px 14px; border: none; border-radius: 10px; background: rgba(255,255,255,0.15); color: #fff; font-size: 15px; cursor: pointer; }
        .date-inputs select option { background: #222; color: #fff; }
        #dateSection button { padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
        #goBtn { background: #fff; color: #000; }
        #cancelBtn { background: rgba(255,255,255,0.1); color: #fff; }

        .loading { display: none; flex-direction: column; align-items: center; gap: 16px; padding: 40px; }
        .loading.active { display: flex; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading p { color: #666; font-size: 14px; }
        .error { display: none; padding: 16px; background: rgba(255,100,100,0.1); border-radius: 10px; margin-top: 16px; text-align: center; color: #ff6b6b; font-size: 14px; }
        .error.active { display: block; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; position: sticky; top: 0; background: #000; z-index: 10; }
        .header button { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; padding: 8px; }
        .content { padding: 0 20px 40px; }
        .date-label { text-align: center; font-size: 12px; color: #555; letter-spacing: 3px; margin-bottom: 16px; font-weight: 500; }

        .lens-box { position: relative; width: 100%; aspect-ratio: 16/10; border-radius: 16px; overflow: hidden; background: #111; margin-bottom: 12px; }
        .lens-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .lens-img.active { display: block; }

        .dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 16px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.2); cursor: pointer; transition: all 0.3s; }
        .dot.active { background: #fff; width: 24px; border-radius: 4px; }

        .pills { display: flex; justify-content: center; gap: 6px; margin-bottom: 28px; flex-wrap: wrap; }
        .pill { padding: 8px 14px; border-radius: 20px; background: rgba(255,255,255,0.08); border: none; color: #999; font-size: 12px; cursor: pointer; font-weight: 500; }
        .pill.active { background: #fff; color: #000; font-weight: 600; }

        .title { font-size: 26px; font-weight: 700; font-family: Georgia, serif; text-align: center; margin-bottom: 16px; line-height: 1.3; }
        .year-wrap { text-align: center; margin-bottom: 20px; }
        .year { display: inline-block; padding: 8px 20px; background: #fff; color: #000; border-radius: 20px; font-size: 15px; font-weight: 700; font-family: monospace; }
        .summary { font-size: 16px; line-height: 1.7; color: rgba(255,255,255,0.8); text-align: center; margin-bottom: 20px; }

        .source-badge { display: flex; align-items: center; justify-content: center; gap: 6px; color: #888; font-size: 11px; margin-bottom: 12px; }
        .disclosure { display: flex; align-items: center; justify-content: center; gap: 6px; color: #555; font-size: 11px; margin-bottom: 28px; }

        .buttons { display: flex; justify-content: center; gap: 12px; }
        .btn { padding: 14px 24px; border-radius: 25px; border: none; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .btn-secondary { background: rgba(255,255,255,0.08); color: #fff; }
        .btn-primary { background: #fff; color: #000; font-weight: 600; }

        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); z-index: 100; padding: 20px; max-width: 430px; margin: 0 auto; overflow-y: auto; }
        .modal.active { display: block; }
        .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-top: 20px; }
        .modal-head h2 { font-size: 20px; }
        .modal-close { background: none; border: none; color: #0a84ff; font-size: 17px; cursor: pointer; }
        .source-link { display: flex; justify-content: space-between; padding: 16px; background: rgba(255,255,255,0.06); border-radius: 12px; margin-bottom: 10px; color: #fff; text-decoration: none; }
        .source-link span:last-child { color: #0a84ff; }

        .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #333; padding: 12px 24px; border-radius: 25px; font-size: 14px; opacity: 0; transition: opacity 0.3s; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<div id="home" class="screen active">
    <div class="logo">
        <h1>FLASHBACK</h1>
        <p>DAILY</p>
    </div>

    <div class="actions">
        <button class="action-btn" id="todayBtn">
            <span class="icon">📅</span>
            <div class="text"><h3>Today in History</h3><p id="todayText"></p></div>
            <span class="arrow">›</span>
        </button>

        <button class="action-btn" id="pickBtn">
            <span class="icon">🗓️</span>
            <div class="text"><h3>Pick a Date</h3><p>Any date in history</p></div>
            <span class="arrow">›</span>
        </button>

        <button class="action-btn" id="randomBtn">
            <span class="icon">🎲</span>
            <div class="text"><h3>Random</h3><p>Surprise me</p></div>
            <span class="arrow">›</span>
        </button>
    </div>

    <div id="dateSection">
        <label>Select a date in history</label>
        <div class="date-inputs">
            <select id="monthSelect"></select>
            <select id="daySelect"></select>
            <select id="yearSelect"></select>
        </div>
        <button id="goBtn">Generate Flashback</button>
        <button id="cancelBtn">Cancel</button>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p id="loadingText">Finding historical events...</p>
    </div>

    <div class="error" id="error"></div>
</div>

<div id="flashback" class="screen">
    <div class="header">
        <button id="backBtn">‹</button>
        <button id="shareBtn2">↗</button>
    </div>
    <div class="content">
        <div class="date-label" id="dateLabel"></div>
        <div class="lens-box" id="lensBox"></div>
        <div class="dots" id="dots"></div>
        <div class="pills" id="pills"></div>
        <h1 class="title" id="eventTitle"></h1>
        <div class="year-wrap"><span class="year" id="eventYear"></span></div>
        <p class="summary" id="eventSummary"></p>
        <div class="source-badge">📚 Wikipedia</div>
        <div class="disclosure"><span>✨</span><span>AI Generated Image</span></div>
        <div class="buttons">
            <button class="btn btn-secondary" id="sourcesBtn">🔗 Sources</button>
            <button class="btn btn-primary" id="shareBtn">↗ Share</button>
        </div>
    </div>
</div>

<div class="modal" id="modal">
    <div class="modal-head">
        <h2>Sources</h2>
        <button class="modal-close" id="closeModal">Done</button>
    </div>
    <div id="sourcesList"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

let currentEvent = null;
let currentLens = 0;

// DOM elements
const homeScreen = document.getElementById('home');
const flashbackScreen = document.getElementById('flashback');
const loading = document.getElementById('loading');
const loadingText = document.getElementById('loadingText');
const errorEl = document.getElementById('error');
const dateSection = document.getElementById('dateSection');
const monthSelect = document.getElementById('monthSelect');
const daySelect = document.getElementById('daySelect');
const yearSelect = document.getElementById('yearSelect');

// Initialize the app
function init() {
    const now = new Date();

    // Set today's date display
    document.getElementById('todayText').textContent = `${MONTHS[now.getMonth()]} ${now.getDate()}`;

    // Populate month dropdown
    MONTHS.forEach((month, i) => {
        const opt = document.createElement('option');
        opt.value = i + 1;
        opt.textContent = month;
        if (i === now.getMonth()) opt.selected = true;
        monthSelect.appendChild(opt);
    });

    // Populate day dropdown (1-31)
    for (let d = 1; d <= 31; d++) {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d;
        if (d === now.getDate()) opt.selected = true;
        daySelect.appendChild(opt);
    }

    // Populate year dropdown (1900 to current year)
    const currentYear = now.getFullYear();
    for (let y = currentYear; y >= 1900; y--) {
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = y;
        yearSelect.appendChild(opt);
    }

    // Event listeners
    document.getElementById('todayBtn').onclick = () => {
        const now = new Date();
        fetchEvent(now.getMonth() + 1, now.getDate(), null);
    };

    document.getElementById('pickBtn').onclick = () => {
        dateSection.classList.toggle('active');
    };

    document.getElementById('cancelBtn').onclick = () => {
        dateSection.classList.remove('active');
    };

    document.getElementById('goBtn').onclick = () => {
        const month = parseInt(monthSelect.value);
        const day = parseInt(daySelect.value);
        const year = parseInt(yearSelect.value);
        fetchEvent(month, day, year);
    };

    document.getElementById('randomBtn').onclick = () => {
        const month = Math.floor(Math.random() * 12) + 1;
        const day = Math.floor(Math.random() * 28) + 1;
        const year = 1900 + Math.floor(Math.random() * 124);
        fetchEvent(month, day, year);
    };

    document.getElementById('backBtn').onclick = goHome;
    document.getElementById('sourcesBtn').onclick = () => document.getElementById('modal').classList.add('active');
    document.getElementById('closeModal').onclick = () => document.getElementById('modal').classList.remove('active');
    document.getElementById('shareBtn').onclick = shareEvent;
    document.getElementById('shareBtn2').onclick = shareEvent;
}

function showLoading(text) {
    loading.classList.add('active');
    loadingText.textContent = text;
    errorEl.classList.remove('active');
    dateSection.classList.remove('active');
}

function hideLoading() {
    loading.classList.remove('active');
}

function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.add('active');
    hideLoading();
}

function goHome() {
    homeScreen.classList.add('active');
    flashbackScreen.classList.remove('active');
}

function showFlashback() {
    homeScreen.classList.remove('active');
    flashbackScreen.classList.add('active');
}

// Fetch event from Wikipedia On This Day API
async function fetchEvent(month, day, targetYear) {
    showLoading('Fetching historical events...');

    try {
        // Wikipedia On This Day API
        const url = `https://en.wikipedia.org/api/rest_v1/feed/onthisday/events/${month}/${day}`;
        const response = await fetch(url);

        if (!response.ok) throw new Error('Failed to fetch events');

        const data = await response.json();
        const events = data.events || [];

        if (events.length === 0) {
            throw new Error('No events found for this date');
        }

        let selectedEvent;

        if (targetYear !== null) {
            // Find event matching the exact year
            selectedEvent = events.find(e => e.year === targetYear);

            // If no exact match, find closest year
            if (!selectedEvent) {
                events.sort((a, b) => Math.abs(a.year - targetYear) - Math.abs(b.year - targetYear));
                selectedEvent = events[0];
            }
        } else {
            // No year specified - pick the most significant event (longest description)
            events.sort((a, b) => (b.text?.length || 0) - (a.text?.length || 0));
            selectedEvent = events[0];
        }

        // Get Wikipedia article title for the event
        const page = selectedEvent.pages?.[0];
        const title = page?.title || selectedEvent.text.substring(0, 50);
        const wikiUrl = page?.content_urls?.desktop?.page || `https://en.wikipedia.org/wiki/${encodeURIComponent(title)}`;

        // Store the event
        currentEvent = {
            month: month,
            day: day,
            year: selectedEvent.year,
            title: title,
            text: selectedEvent.text,
            wikiUrl: wikiUrl
        };

        showLoading('Generating AI image...');

        // Generate images based on the event
        await displayEvent();

    } catch (err) {
        showError(err.message);
    }
}

// Display the event
async function displayEvent() {
    // Set the date label
    document.getElementById('dateLabel').textContent = `${MONTHS[currentEvent.month - 1]} ${currentEvent.day}`.toUpperCase();

    // Set event details
    document.getElementById('eventTitle').textContent = currentEvent.title;
    document.getElementById('eventYear').textContent = currentEvent.year;
    document.getElementById('eventSummary').textContent = currentEvent.text;

    // Generate 5 AI images based on the event
    const lensBox = document.getElementById('lensBox');
    lensBox.innerHTML = '';

    const lensNames = ['Wide', 'POV', 'Detail', 'Behind', 'After'];
    const lensPrompts = [
        `${currentEvent.text} ${currentEvent.year} wide establishing shot historical photograph`,
        `${currentEvent.text} ${currentEvent.year} first person point of view historical`,
        `${currentEvent.text} ${currentEvent.year} close up detail shot historical`,
        `${currentEvent.text} ${currentEvent.year} behind the scenes candid historical`,
        `${currentEvent.text} ${currentEvent.year} aftermath consequences historical photograph`
    ];

    // Create images using Pollinations AI
    for (let i = 0; i < 5; i++) {
        const img = document.createElement('img');
        img.className = i === 0 ? 'lens-img active' : 'lens-img';
        img.alt = lensNames[i];

        // Use Pollinations.ai for AI-generated images
        const prompt = encodeURIComponent(lensPrompts[i].substring(0, 200));
        img.src = `https://image.pollinations.ai/prompt/${prompt}?width=800&height=500&seed=${currentEvent.year * 10 + i}&nologo=true`;

        lensBox.appendChild(img);
    }

    // Create dots
    const dots = document.getElementById('dots');
    dots.innerHTML = lensNames.map((_, i) =>
        `<div class="dot${i === 0 ? ' active' : ''}" data-index="${i}"></div>`
    ).join('');

    // Create pills
    const pills = document.getElementById('pills');
    pills.innerHTML = lensNames.map((name, i) =>
        `<button class="pill${i === 0 ? ' active' : ''}" data-index="${i}">${name}</button>`
    ).join('');

    // Add click handlers for dots and pills
    dots.onclick = (e) => {
        if (e.target.dataset.index !== undefined) {
            selectLens(parseInt(e.target.dataset.index));
        }
    };

    pills.onclick = (e) => {
        if (e.target.dataset.index !== undefined) {
            selectLens(parseInt(e.target.dataset.index));
        }
    };

    // Add swipe support
    let touchStartX = 0;
    lensBox.ontouchstart = (e) => { touchStartX = e.touches[0].clientX; };
    lensBox.ontouchend = (e) => {
        const diff = touchStartX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 50) {
            selectLens(currentLens + (diff > 0 ? 1 : -1));
        }
    };

    // Set up sources modal
    document.getElementById('sourcesList').innerHTML = `
        <a href="${currentEvent.wikiUrl}" target="_blank" class="source-link">
            <span>Wikipedia - ${currentEvent.title}</span>
            <span>↗</span>
        </a>
    `;

    currentLens = 0;
    hideLoading();
    showFlashback();
}

function selectLens(index) {
    if (index < 0 || index > 4) return;
    currentLens = index;

    // Update images
    document.querySelectorAll('.lens-img').forEach((img, i) => {
        img.classList.toggle('active', i === index);
    });

    // Update dots
    document.querySelectorAll('.dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === index);
    });

    // Update pills
    document.querySelectorAll('.pill').forEach((pill, i) => {
        pill.classList.toggle('active', i === index);
    });
}

function shareEvent() {
    if (!currentEvent) return;

    const text = `On ${MONTHS[currentEvent.month - 1]} ${currentEvent.day}, ${currentEvent.year}:\n\n${currentEvent.text}\n\n✨ Flashback Daily`;

    if (navigator.share) {
        navigator.share({ title: 'Flashback Daily', text: text });
    } else {
        navigator.clipboard.writeText(text);
        const toast = document.getElementById('toast');
        toast.textContent = 'Copied to clipboard!';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
}

// Start the app
init();
</script>
</body>
</html>
